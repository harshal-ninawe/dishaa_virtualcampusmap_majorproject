async function run() {
  const worker = await Tesseract.createWorker('eng');
  const results = [];
  for (let i = 0; i < labels.length; i++) {
    const l = labels[i];
    document.getElementById('status').innerText = `Processing ${i+1}/${labels.length}: ${l.file}...`;
    const ret = await worker.recognize(`/A-Block/${l.file}`);
    const text = ret.data.text.trim().replace(/\n+/g, ' ');
    results.push({ ...l, text });
    document.getElementById('output').innerText = JSON.stringify(results, null, 2);
  }
  await worker.terminate();
  document.getElementById('status').innerText = "DONE!";
  window.OCR_RESULTS = results;
}
